openapi: "3.0.3"
info:
  title: Multi-tag per operation
  version: "1.0"
paths:
  /pets:
    get:
      tags:
        - pets
        - animals
        - store
      operationId: listPets
      summary: List all pets
      responses:
        "200":
          description: OK
  /pets/{id}:
    get:
      tags:
        - pets
        - animals
      operationId: getPet
      summary: Get a pet by ID
      responses:
        "200":
          description: OK
  /admin/settings:
    get:
      tags:
        - admin
      operationId: getSettings
      summary: Get admin settings
      responses:
        "200":
          description: OK
