openapi: "3.0.3"
info:
  title: Default Configuration API
  version: "1.0.0"
paths:
  /pets:
    get:
      tags: [pets]
      operationId: listPets
      responses:
        "200":
          description: the pets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pet" }
  /pets/{petId}:
    get:
      tags: [pets]
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: one pet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
  /owners:
    get:
      tags: [owners]
      operationId: listOwners
      responses:
        "200":
          description: the owners
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Owner" }
components:
  schemas:
    Pet:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Owner:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        pets:
          type: array
          items: { $ref: "#/components/schemas/Pet" }
